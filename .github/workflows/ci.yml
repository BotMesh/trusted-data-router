name: Rust framework
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tunnel/chisel/go.mod
          cache-dependency-path: tunnel/chisel/go.sum
      - name: Test and build pinned upstream tunnel adapter
        working-directory: tunnel/chisel
        run: |
          test -z "$(gofmt -l .)"
          go test -race ./...
          CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/trusted-router-tunnel" .
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - name: Test upstream process lifecycle and TCP semantics
        env:
          TRUSTED_ROUTER_TUNNEL_BINARY: ${{ runner.temp }}/trusted-router-tunnel
        run: cargo test --locked -p trusted-router-transport --test chisel_process -- --ignored
