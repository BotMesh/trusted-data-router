[workspace]
members = ["crates/contracts", "crates/router", "crates/transport"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"

[workspace.dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
trusted-contracts = { path = "crates/contracts", version = "0.1.0" }

[profile.dev]
debug = 0
